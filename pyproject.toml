[project]
name = "noether-core"
version = "0.1.0"
description = "Domain-agnostic double-entry conservation ledger backend"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "drf-nested-routers>=0.94",
    "drf-spectacular>=0.28",
    "djangorestframework-simplejwt>=5.4",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "celery[redis]>=5.4",
    "django-celery-beat>=2.7",
    "redis>=5.0",
    "django-filter>=26.1",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "coverage>=7.6",
    "factory-boy>=3.3",
    "hypothesis>=6.115",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noether", "config", "plugs"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["SIM105"]

[tool.coverage.run]
branch = true
source = ["noether"]
omit = [
    "*/migrations/*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
