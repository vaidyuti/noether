coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 100%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: false

ignore:
  - "**/migrations/*"
  - "manage.py"
  - "config/wsgi.py"
  - "config/asgi.py"

github_checks:
  annotations: true
